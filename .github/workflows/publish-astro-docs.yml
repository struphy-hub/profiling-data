name: Build and deploy Astro docs

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only the newest run per branch/PR matters: pushing again supersedes whatever
# is still building, so cancel the older run instead of racing it to Pages.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # The scope-profiler submodule comes with it, pinned to one commit.
      # Both halves of the chart pipeline are built from that commit: the
      # figure JSON by scripts/generate_figures.py, and the browser chart
      # code by npm, which resolves @scope-profiler/plotly to the package
      # inside the submodule. Tracking a branch instead let the two drift.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Generate figures
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python scripts/generate_figures.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies (docs)
        working-directory: docs
        run: npm ci

      - name: Build site (docs)
        working-directory: docs
        run: npm run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
