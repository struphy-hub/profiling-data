name: Build and deploy Astro docs

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only the newest run per branch/PR matters: pushing again supersedes whatever
# is still building, so cancel the older run instead of racing it to Pages.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      # Figure JSON is generated from the current scope-profiler source.
      # The browser chart code itself is installed from npm below.
      - name: Checkout scope-profiler
        uses: actions/checkout@v4
        with:
          repository: max-models/scope-profiler
          ref: devel
          path: vendor/scope-profiler

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Generate figures
        run: |
          python -m pip install --upgrade pip
          pip install "./vendor/scope-profiler[pproc]"
          pip install flameprof
          python scripts/generate_figures.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies (docs)
        working-directory: docs
        run: npm ci

      - name: Build site (docs)
        working-directory: docs
        run: npm run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
